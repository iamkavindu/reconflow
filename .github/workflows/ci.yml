name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify Compose Kafka delivery
        run: |
          docker compose up -d kafka
          ./mvnw --batch-mode --no-transfer-progress -Dtest=ProviderSimulationIntegrationTest -Dreconflow.test.kafka-bootstrap-servers=localhost:9092 test

      - name: Capture Kafka diagnostics
        if: failure()
        run: docker compose logs --no-color kafka

      - name: Stop Compose services
        if: always()
        run: docker compose down

      - name: Capture formatting diagnostic
        if: failure()
        run: |
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          git diff -- src

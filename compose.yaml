services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: reconflow
      POSTGRES_USER: reconflow
      POSTGRES_PASSWORD: reconflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./dev/keycloak/reconflow-realm.json:/opt/keycloak/data/import/reconflow-realm.json:ro
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    profiles: [observability]
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
    cpus: 2
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./dev/observability/opensearch.yaml:/usr/share/opensearch/config/opensearch.yml:ro
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' | grep -Eq 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30
  telemetry-schemas:
    image: python:3.13.7-alpine
    profiles: [observability]
    command: [python, /config/bootstrap.py, --schemas-only, --opensearch-url, "http://opensearch:9200"]
    volumes: ["./dev/observability:/config:ro"]
    depends_on:
      opensearch: {condition: service_healthy}
    mem_limit: 128m
  data-prepper:
    image: opensearchproject/data-prepper:2.12.2
    profiles: [observability]
    environment:
      JAVA_OPTS: -Xms256m -Xmx512m
    mem_limit: 1024m
    cpus: 2
    volumes:
      - ./dev/observability/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./dev/observability/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      telemetry-schemas: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:4900/list | grep -q traces"]
      interval: 10s
      timeout: 5s
      retries: 30
  otel-collector:
    image: reconflow-otel-collector:0.137.0-local
    build:
      context: ./dev/observability
      dockerfile: collector.Dockerfile
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    mem_limit: 256m
    cpus: 1
    ports: ["127.0.0.1:4318:4318"]
    volumes: ["./dev/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on:
      data-prepper: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 12
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.3.0
    profiles: [observability]
    environment:
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 1024m
    cpus: 2
    ports: ["127.0.0.1:5601:5601"]
    volumes:
      - ./dev/observability/opensearch_dashboard.yaml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    depends_on:
      opensearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | /usr/share/opensearch-dashboards/node/bin/node -e 'let data=\"\";process.stdin.on(\"data\",c=>data+=c);process.stdin.on(\"end\",()=>{try{process.exit(JSON.parse(data).status.overall.state===\"green\"?0:1)}catch{process.exit(1)}})'"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  kafka-data:
  opensearch-data:

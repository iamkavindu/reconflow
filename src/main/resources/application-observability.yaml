management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,providerKafka
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.template: true
        spring.kafka.listener: true
    tags:
      application: reconflow
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    export:
      otlp:
        enabled: true
  opentelemetry:
    logging:
      export:
        schedule-delay: 1s
        max-queue-size: 2048
        max-batch-size: 256
        timeout: 5s
        otlp:
          transport: http
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:${OTLP_BASE_URL:http://localhost:4318}/v1/logs}
    resource-attributes:
      service.name: reconflow
    tracing:
      export:
        schedule-delay: 1s
        otlp:
          transport: http
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTLP_BASE_URL:http://localhost:4318}/v1/traces}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTLP_BASE_URL:http://localhost:4318}/v1/metrics}
        step: 10s
        aggregation-temporality: delta
        base-time-unit: seconds
  logging:
    export:
      otlp:
        enabled: true
  level:
    org.apache.kafka.clients.admin.AdminClientConfig: WARN

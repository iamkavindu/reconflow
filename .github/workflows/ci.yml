name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Prepare indexed telemetry
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose --profile observability up -d --build --wait --wait-timeout 300
          python3 dev/observability/bootstrap.py > /tmp/reconflow-bootstrap-first.json
          python3 dev/observability/bootstrap.py > /tmp/reconflow-bootstrap-repeat.json

      - name: Verify Compose Kafka delivery
        run: |
          docker compose --profile observability up -d
          ./mvnw --batch-mode --no-transfer-progress -Dtest=ProviderSimulationIntegrationTest -Dreconflow.test.kafka-bootstrap-servers=localhost:9092 test

      - name: Verify startup without telemetry exports
        run: |
          java -jar target/reconflow-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo --server.port=18081 > /tmp/reconflow-disabled-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time, urllib.error, urllib.request
          deadline = time.monotonic() + 90
          while True:
              try:
                  urllib.request.urlopen('http://localhost:18081/api/session', timeout=3)
              except urllib.error.HTTPError as error:
                  if error.code == 401:
                      break
              except OSError:
                  pass
              assert time.monotonic() < deadline, 'Base/demo startup did not become available'
              time.sleep(0.5)
          with socket.socket() as listener:
              assert listener.connect_ex(('127.0.0.1', 9091)) != 0, 'Disabled profile exposed management'
          PY

      - name: Verify complete authenticated demo
        run: |
          python3 -m py_compile dev/demo.py
          LOCAL_AI_ENABLED=false java -jar target/reconflow-0.0.1-SNAPSHOT.jar --spring.profiles.active=local --server.port=18080 > /tmp/reconflow-demo-app.log 2>&1 &
          demo_app_pid=$!
          trap 'kill "$demo_app_pid" 2>/dev/null || true; wait "$demo_app_pid" 2>/dev/null || true' EXIT
          python3 dev/demo.py --base-url http://localhost:18080 > /tmp/reconflow-demo-first.json
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          first = json.loads(Path("/tmp/reconflow-demo-first.json").read_text())
          second = subprocess.run([sys.executable, "dev/demo.py", "--base-url", "http://localhost:18080",
                                   "--run-id", first["runId"]], check=True, capture_output=True, text=True)
          replay = json.loads(second.stdout)
          assert len(first["scenarios"]) == 8
          assert first["tenantIsolationVerified"] and replay["tenantIsolationVerified"]
          for original, repeated in zip(first["scenarios"], replay["scenarios"], strict=True):
              assert original == repeated, (original["name"], "replay changed financial identities or audit evidence")
              assert original["auditVerified"]
          assert first["dashboard"] == {"transactionsProcessed": 7, "matched": 2, "reviewRequired": 4,
                                        "unmatched": 2, "openCases": 6, "resolvedCases": 0}
          assert replay["dashboard"] == first["dashboard"]
          print("All eight scenarios, both tenant boundaries, audit checks and idempotent replay passed.")
          PY
          npm --prefix dev/browser ci --ignore-scripts --no-audit --no-fund
          (cd dev/browser && npx playwright install chromium && npm test)
          python3 dev/observe.py --base-url http://localhost:18080 --log-file /tmp/reconflow-demo-app.log > /tmp/reconflow-telemetry.json
          VERIFY_OBSERVABILITY=true npm --prefix dev/browser test -- observability.spec.js
          docker compose stop otel-collector data-prepper
          python3 dev/observe.py --base-url http://localhost:18080 --workflow-only > /tmp/reconflow-telemetry-outage.json
          docker compose start data-prepper otel-collector
          docker compose restart opensearch
          python3 dev/observability/bootstrap.py
          python3 - <<'PY'
          import json, urllib.request
          evidence = json.load(open('/tmp/reconflow-telemetry.json'))
          counts = {}
          for signal, index, query in [
              ('traces', 'otel-v1-apm-span-*', {'term': {'traceId': evidence['traceId']}}),
              ('logs', 'reconflow-logs-*', {'term': {'traceId': evidence['traceId']}}),
              ('metrics', 'ss4o_metrics-otel-reconflow-v2-*', {'range': {'time': {'gte': evidence['startedAt']}}})]:
              body = json.dumps({'query': query}).encode()
              request = urllib.request.Request('http://127.0.0.1:9200/' + index + '/_count', data=body, headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=10) as response:
                  counts[signal] = json.load(response)['count']
          assert counts['traces'] >= evidence['traceVerified']['spanCount'] and counts['logs'] > 0 and counts['metrics'] > 0
          open('/tmp/reconflow-telemetry-restart.json', 'w').write(json.dumps({'retainedDocuments': counts, 'traceId': evidence['traceId']}))
          print('Indexed traces, logs and metrics survived normal OpenSearch restart.')
          PY

      - name: Verify AI-enabled acceptance with local protocol fixtures
        env:
          AI_MODEL: fixture-model
          AI_EMBEDDING_MODEL: fixture-embedding
          AI_API_KEY: fixture-key
          TYPESAFE_API_KEY: fixture-key
          AI_BASE_URL: http://127.0.0.1:18888/v1
          TYPESAFE_BASE_URL: http://127.0.0.1:18888
        run: |
          python3 -m py_compile dev/demo.py dev/ai_fixture.py
          python3 dev/ai_fixture.py > /tmp/reconflow-ai-fixture.log 2>&1 &
          fixture_pid=$!
          java -jar target/reconflow-0.0.1-SNAPSHOT.jar --spring.profiles.active=local --server.port=18080 > /tmp/reconflow-ai-app.log 2>&1 &
          ai_app_pid=$!
          trap 'kill "$ai_app_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          python3 dev/demo.py --base-url http://localhost:18080 --investigate --investigation-timeout 90 > /tmp/reconflow-ai-demo.json
          npm --prefix dev/browser run test:ai
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/reconflow-ai-demo.json').read_text())
          assert all(result['aiAcceptance'].values())
          print('AI-enabled acceptance passed using fixed local protocol fixtures; live AI quality is not evaluated.')
          PY
          docker compose stop kafka
          python3 dev/observe.py --expect-broker-down

      - name: Capture browser screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots
          path: |
            dev/browser/screenshots/
            dev/browser/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-evidence
          path: |
            /tmp/reconflow-demo-first.json
            /tmp/reconflow-ai-demo.json
            /tmp/reconflow-telemetry*.json
            /tmp/reconflow-bootstrap*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture component diagnostics
        if: failure()
        run: |
          docker compose --profile observability ps -a
          docker compose --profile observability logs --no-color --tail=300
          if test -f /tmp/reconflow-demo-app.log; then cat /tmp/reconflow-demo-app.log; fi
          if test -f /tmp/reconflow-ai-app.log; then cat /tmp/reconflow-ai-app.log; fi
          if test -f /tmp/reconflow-ai-fixture.log; then cat /tmp/reconflow-ai-fixture.log; fi

      - name: Stop Compose services
        if: always()
        run: docker compose --profile observability down
